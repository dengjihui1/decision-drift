[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-drift"
version = "0.1.0"
description = "Invalidation-aware decision memory for projects and research"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Zihui Deng"}]
dependencies = []

[project.scripts]
decision-drift = "decision_drift.cli:main"

[tool.setuptools.packages.find]
include = ["decision_drift*"]
