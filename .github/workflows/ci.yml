name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/decision_drift.py validate demo/decision-ledger.json demo/events.json
      - run: python scripts/decision_drift.py check demo/decision-ledger.json demo/events.json --output-dir ci-output
      - run: python scripts/decision_drift.py calibrate demo/decision-ledger.json --output-dir ci-output
